name: Publish to PyPI

on:
  push:
    tags:
      - "v*"          # Срабатывает на теги вида v1.0.0, v1.2.3
  workflow_dispatch:   # Возможность запустить вручную из UI

jobs:
  build:
    name: Сборка дистрибутивов
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Установить build
        run: python -m pip install --upgrade build

      - name: Собрать sdist и wheel
        run: python -m build

      - name: Загрузить артефакты
        uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/

  publish:
    name: Публикация на PyPI
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/p/asterisk-cdr-api

    permissions:
      id-token: write   # Нужно для Trusted Publishing (без пароля)

    steps:
      - name: Скачать артефакты
        uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/

      - name: Опубликовать на PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        # Trusted Publishing — токены не нужны.
        # Привязка задаётся на PyPI:
        #   Account → Publishing → Add a new pending publisher
        #     Owner:       it-healer
        #     Repository:  asterisk-cdr-api
        #     Workflow:    publish.yml
        #     Environment: pypi
